org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Legacy debug-only model origin. Google Play builds use the install-time asset
# pack; leave this blank unless testing the retired downloader.
modelBaseUrl=
# Debug/Beta cloud authorization comes from the private GPU broker. The model
# itself is part of the AAB and does not use this endpoint.
betaEntitlementApiUrl=https://34-238-98-220.sslip.io/beta-access
proProductId=sunny_pro
proIntroOfferTag=sunny-pro-intro
# Remote processing is fail-closed. A dedicated beta build may receive HTTPS
# endpoints from SUNNY_INFERENCE_API_URL / SUNNY_CONTRIBUTE_URL at build time.
inferenceMode=device
contributionMode=disabled
