org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Optional debug-only static model origin. Leave blank when the beta entitlement
# broker supplies short-lived signed GPU URLs.
modelBaseUrl=
# Debug/Beta download directly from the private GPU host through its HTTPS,
# checksum-pinned, range-resumable signed model gateway. Public Release does not
# use this value; it requires entitlementApiUrl/SUNNY_ENTITLEMENT_API_URL.
betaEntitlementApiUrl=https://34-238-98-220.sslip.io/beta-access
proProductId=sunny_pro
proIntroOfferTag=sunny-pro-intro
# Remote processing is fail-closed. A dedicated beta build may receive HTTPS
# endpoints from SUNNY_INFERENCE_API_URL / SUNNY_CONTRIBUTE_URL at build time.
inferenceMode=device
contributionMode=disabled
