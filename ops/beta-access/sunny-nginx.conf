limit_req_zone $binary_remote_addr zone=sunny_beta_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=sunny_model_connections:10m;

log_format sunny_metadata '$remote_addr - $request_method $uri $status '
                          '$body_bytes_sent $request_time';

server {
    listen 80;
    server_name 34-238-98-220.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 34-238-98-220.sslip.io;

    ssl_certificate /etc/letsencrypt/live/34-238-98-220.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34-238-98-220.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:SunnyTLS:10m;

    access_log /var/log/nginx/sunny_access.log sunny_metadata;
    error_log /var/log/nginx/sunny_error.log warn;
    client_max_body_size 8m;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /beta-access/ {
        limit_req zone=sunny_beta_per_ip burst=10 nodelay;
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 190s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location ^~ /_protected_sunny_models/ {
        internal;
        alias /srv/sunny-models/;
        limit_conn sunny_model_connections 2;
        limit_except GET HEAD { deny all; }
        sendfile on;
        aio threads;
        directio 8m;
        add_header Cache-Control "private, no-store" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Legacy shared-token routes are intentionally gone. Apps obtain short-lived
    # per-install credentials from /beta-access/v1/access/free instead.
    location / { return 404; }
}
