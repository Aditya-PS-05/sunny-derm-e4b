name = "sunny-entitlements"
main = "src/index.ts"
compatibility_date = "2026-07-15"

[triggers]
crons = ["0 3 1 * *"]

[vars]
GOOGLE_PLAY_PACKAGE = "com.sunny.skin"
PRO_PRODUCT_ID = "sunny_pro"
FREE_MONTHLY_LIMIT = "5"
FREE_DAILY_LIMIT = "2"
PRO_MONTHLY_LIMIT = "100"
PRO_DAILY_LIMIT = "25"
ACCESS_TOKEN_TTL_SECONDS = "21600"
MODEL_URL_TTL_SECONDS = "43200"

# Create these resources before deployment, then uncomment and fill their IDs.
# [[d1_databases]]
# binding = "DB"
# database_name = "sunny-entitlements"
# database_id = "<D1_DATABASE_ID>"
# migrations_dir = "migrations"
#
# [[r2_buckets]]
# binding = "MODEL_BUCKET"
# bucket_name = "sunny-models-private"

# Configure these only with `wrangler secret put`:
# GOOGLE_SERVICE_ACCOUNT_EMAIL
# GOOGLE_PRIVATE_KEY
# MODEL_TOKEN_SECRET (at least 32 random bytes)
# INFERENCE_UPSTREAM_URL (exact HTTPS chat-completions endpoint)
# INFERENCE_UPSTREAM_TOKEN
